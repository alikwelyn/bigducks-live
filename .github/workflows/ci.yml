name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build release executable
        shell: pwsh
        run: .\build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: BigDucks-windows-amd64
          path: dist/BigDucks.exe
